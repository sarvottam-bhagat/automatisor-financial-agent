[project]
name = "automatisor-financial-agent"
version = "0.1.0"
description = "A persona-configurable, MCP-grounded financial research agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.18,<2",
  "pydantic>=2.10,<3",
  "pydantic-ai-slim[mcp,openai]>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "streamlit>=1.57,<2",
  "uvicorn>=0.34,<1",
  "yfinance>=0.2.54,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
]

[project.scripts]
automatisor-build-db = "automatisor.ingestion.build_database:main"
automatisor-mcp = "automatisor.mcp_server:main"
automatisor-api = "automatisor.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automatisor"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
